[package]
name = "cloudflare-ddns"
version = "3.0.0"
edition = "2021"
authors = ["cloudflare-ddns contributors"]
license = "MIT"
description = "A lightweight, high-performance Cloudflare DDNS updater"

[dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
